<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Croqui · Ambiente em 3D</title>
<style>
:root{--bg:#F6F5F2;--surface:#fff;--surface2:#F0EEE9;--text:#1D2023;--muted:#6B6F73;--border:#E0DDD5;--amber:#FFB224;--amberD:#9A6200;--c1:#F2F3F4;--c2:#D3D8DC}
:root[data-t=dark]{--bg:#121417;--surface:#1B1E22;--surface2:#24282D;--text:#F3F1EC;--muted:#9AA0A6;--border:#2C3036;--amberD:#FFB224;--c1:#2B3036;--c2:#14171A}
@media(prefers-color-scheme:dark){:root:not([data-t=light]){--bg:#121417;--surface:#1B1E22;--surface2:#24282D;--text:#F3F1EC;--muted:#9AA0A6;--border:#2C3036;--amberD:#FFB224;--c1:#2B3036;--c2:#14171A}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.mark{width:30px;height:30px;border-radius:8px;background:#1D2023;display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:20px}
.ttl{min-width:0;flex:1}
.ttl b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;flex:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.seg button,.btn{padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px}
.seg button.on{background:var(--amber);color:#1D2023}
.btn{background:var(--surface2);border:1px solid var(--border)}
#main{flex:1;display:flex;min-height:0}
#view{flex:1;position:relative;min-width:0;background:linear-gradient(var(--c1),var(--c2));touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hint{position:absolute;left:12px;bottom:12px;right:12px;pointer-events:none;display:flex;justify-content:center}
#hint span{background:#1D2023;color:#F3F1EC;border-radius:10px;padding:7px 12px;font-size:12.5px;opacity:.92}
aside{width:340px;flex:none;background:var(--surface);border-left:1px solid var(--border);overflow:auto;padding:16px}
@media(max-width:760px){#main{flex-direction:column}aside{width:auto;max-height:46%;border-left:0;border-top:1px solid var(--border);padding:12px 14px}header{padding:8px 12px}}
.kind{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--amberD)}
h2{margin:2px 0 2px;font-size:19px}
.sub{color:var(--muted);font-size:12.5px;margin-bottom:10px}
.sec{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 10px;border-radius:9px;background:var(--surface2);margin-bottom:5px;font-size:13.5px}
.row b{font-variant-numeric:tabular-nums;white-space:nowrap}
.row i{font-style:normal;color:var(--muted);display:block;font-size:11.5px}
.row.link{cursor:pointer;border:1px solid var(--border)}
.row.link:active{background:var(--border)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.foot{margin-top:18px;color:var(--muted);font-size:11.5px}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="mark"><svg viewBox="0 0 240 240"><path d="M168 64H92a40 40 0 0 0-40 40v32a40 40 0 0 0 40 40h76" fill="none" stroke="#F3F1EC" stroke-width="26" stroke-linecap="round"/><path d="M96 150c8-30 34-46 74-40" fill="none" stroke="#FFB224" stroke-width="22" stroke-linecap="round"/></svg></div>
  <div class="ttl"><b id="t1">Croqui</b><span id="t2"></span></div>
  <div class="seg"><button id="bIso" class="on">3D</button><button id="bTop">Planta</button></div>
  <button class="btn" id="bFit">Enquadrar</button>
</header>
<div id="main">
  <div id="view"><canvas id="cv"></canvas><div id="hint"><span id="hintT">Arraste para girar · pinça ou roda para aproximar · toque em qualquer item para ver as cotas</span></div></div>
  <aside id="panel"></aside>
</div>
</div>
<script>
"use strict";
const DATA = /*CROQUI_DATA*/null;

/* ───────────── utilitários ───────────── */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D = null, CM = false;
const fmt = mm => {
  if (CM) { const v = Math.round(mm) / 10; return (Number.isInteger(v) ? String(v) : v.toFixed(1)).replace(".", ",") + " cm"; }
  return Math.round(mm).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".") + " mm";
};
const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ───────────── modelo ───────────── */
let rooms = [], els = [], fus = [], bbox = null;

function buildModel() {
  rooms = D.rooms.map((r, ri) => {
    const P = r.p, n = P.length, wc = r.c ? n : n - 1;
    let sA = 0;
    for (let i = 0; i < n; i++) { const a = P[i], b = P[(i+1)%n]; sA += a[0]*b[1] - b[0]*a[1]; }
    const walls = [];
    for (let i = 0; i < wc; i++) {
      const A = P[i], B = P[(i+1)%n];
      const L = Math.hypot(B[0]-A[0], B[1]-A[1]);
      const dir = [(B[0]-A[0])/L, (B[1]-A[1])/L];
      const out = r.o[i];
      walls.push({ i, A, B, L, dir, out, inn: [-out[0], -out[1]], t: r.t, H: r.h, r: ri, w: null });
    }
    const R = { i: ri, name: r.n, closed: !!r.c, t: r.t, H: r.h, P, walls, sA, area: r.a };
    walls.forEach(w => {
      w.w = (s, y, d) => [w.A[0] + w.dir[0]*s + w.inn[0]*d, y, w.A[1] + w.dir[1]*s + w.inn[1]*d];
      w.S = [w.dir[0], 0, w.dir[1]]; w.N = [w.inn[0], 0, w.inn[1]];
    });
    // cantos convexos (para fechar a espessura nas quinas externas)
    walls.forEach(w => {
      if (!R.closed) { w.cs = w.ce = false; return; }
      const nx = walls[(w.i + 1) % wc], pv = walls[(w.i + wc - 1) % wc];
      w.ce = (w.dir[0]*nx.dir[1] - w.dir[1]*nx.dir[0]) * sA > 0;
      w.cs = (pv.dir[0]*w.dir[1] - pv.dir[1]*w.dir[0]) * sA > 0;
    });
    return R;
  });
  const cnt = {};
  els = D.els.map((e, k) => {
    const R = rooms[e.r], W = R && R.walls[e.w];
    if (!W) return null;
    const key = e.r + ":" + e.k;
    cnt[key] = (cnt[key] || 0) + 1;
    return Object.assign({ id: k, R, W, n: cnt[key] }, e);
  }).filter(Boolean);
  els.forEach(e => { e.total = els.filter(x => x.r === e.r && x.k === e.k).length; e.name = e.l + (e.total > 1 ? " " + e.n : ""); });
  const fc = {};
  fus = (D.fu || []).map((f, k) => {
    const key = f.k; fc[key] = (fc[key] || 0) + 1;
    return Object.assign({ id: k, R: rooms[f.r] || null, n: fc[key], rr: (f.rot || 0) * Math.PI / 180 }, f);
  });
  fus.forEach(f => { f.total = fus.filter(x => x.k === f.k && x.l === f.l).length; f.name = f.l; });
  let mn = [1e9, 0, 1e9], mx = [-1e9, 0, -1e9], hMax = 0;
  rooms.forEach(R => { hMax = Math.max(hMax, R.H); R.P.forEach(p => { mn[0] = Math.min(mn[0], p[0]); mn[2] = Math.min(mn[2], p[1]); mx[0] = Math.max(mx[0], p[0]); mx[2] = Math.max(mx[2], p[1]); }); });
  bbox = { mn, mx, h: hMax, c: [(mn[0]+mx[0])/2, hMax/2, (mn[2]+mx[2])/2], size: Math.max(mx[0]-mn[0], mx[2]-mn[2], hMax) };
}

/* ───────────── geometria 3D ───────────── */
let faces = [];
const COL = {
  wallIn: [233, 230, 224], wallOut: [206, 202, 194], wallTop: [92, 98, 106], floor: [201, 195, 182],
  door: [170, 120, 74], glass: [140, 200, 232], pillar: [150, 145, 136], beam: [176, 166, 148], tooth: [226, 223, 216],
};
const FCOL = {
  SOFA: [120, 132, 148], POLTRONA: [128, 120, 148], MESA: [184, 146, 104], MESA_CENTRO: [194, 158, 116], CADEIRA: [168, 130, 92],
  CAMA_CASAL: [150, 162, 184], CAMA_SOLTEIRO: [150, 162, 184], CRIADO: [184, 146, 104], RACK: [120, 104, 90],
  GELADEIRA: [208, 211, 215], FOGAO: [92, 96, 102], OUTRO: [172, 162, 142],
};
const TECH = { TOMADA: [224, 88, 74], INTERRUPTOR: [224, 88, 74], AGUA: [61, 154, 209], AGUA_Q: [217, 83, 79], ESGOTO: [122, 102, 82], GAS: [227, 162, 26] };

const isPia = e => e.k === "PIA1" || e.k === "PIA2";
function piaCubas(e) {
  const w = e.wd, s0 = e.p, M = Math;
  if (e.k === "PIA1") {
    const raw = e.cw > 0 ? e.cw : M.min(500, w * 0.55), cw = M.min(M.max(raw, 50), M.max(50, w - 20));
    const g0 = e.cg >= 0 ? e.cg : M.min(80, w * 0.08), gap = M.min(M.max(g0, 0), M.max(0, w - cw)), a = e.hg ? s0 + w - gap - cw : s0 + gap;
    return [[a, a + cw]];
  }
  const raw = e.cw > 0 ? e.cw : M.min(450, w * 0.36), cw = M.min(M.max(raw, 50), M.max(50, (w - 20) / 2));
  const g0 = e.cg >= 0 ? e.cg : (w - 2 * cw) / 3, gap = M.min(M.max(g0, 0), M.max(0, w - 2 * cw)), edge = (w - 2 * cw - gap) / 2;
  return [[s0 + edge, s0 + edge + cw], [s0 + edge + cw + gap, s0 + edge + 2 * cw + gap]];
}
const piaCD = e => e.cd > 0 ? Math.min(Math.max(e.cd, 50), Math.max(50, e.dp - 20)) : Math.max(150, Math.min(400, e.dp - 120));

function mk(pts, n, col, tag, o) { return Object.assign({ p: pts, n, col, tag, a: 1 }, o || {}); }

function box(W, s0, s1, y0, y1, d0, d1, col, tag, o) {
  const P = W.w, S = W.S, N = W.N, out = [];
  o = o || {};
  const mkf = (pts, n, c) => out.push(mk(pts, n, c || col, tag, o));
  mkf([P(s0,y0,d1), P(s1,y0,d1), P(s1,y1,d1), P(s0,y1,d1)], N, o.cIn);
  mkf([P(s1,y0,d0), P(s0,y0,d0), P(s0,y1,d0), P(s1,y1,d0)], [-N[0], 0, -N[2]], o.cOut);
  mkf([P(s0,y0,d0), P(s0,y0,d1), P(s0,y1,d1), P(s0,y1,d0)], [-S[0], 0, -S[2]], o.cCap);
  mkf([P(s1,y0,d1), P(s1,y0,d0), P(s1,y1,d0), P(s1,y1,d1)], S, o.cCap);
  mkf([P(s0,y1,d1), P(s1,y1,d1), P(s1,y1,d0), P(s0,y1,d0)], [0, 1, 0], o.cTop);
  if (y0 > 1) mkf([P(s0,y0,d0), P(s1,y0,d0), P(s1,y0,d1), P(s0,y0,d1)], [0, -1, 0], o.cTop);
  return out;
}

function buildFaces() {
  faces = [];
  rooms.forEach(R => {
    if (R.closed && R.P.length >= 3) faces.push(mk(R.P.map(p => [p[0], 0, p[1]]), [0, 1, 0], COL.floor, { k: "r", r: R.i }, { floor: true, cull: false, edge: false }));
    R.walls.forEach(W => {
      const onW = els.filter(e => e.R === R && e.W === W);
      const cuts = onW.filter(e => e.cut).map(e => ({ s0: Math.max(0, e.p), s1: Math.min(W.L, e.p + e.wd), y0: e.sl, y1: Math.min(W.H, e.sl + e.ht) })).sort((a, b) => a.s0 - b.s0);
      const tag = { k: "w", r: R.i, i: W.i }, wk = R.i + ":" + W.i;
      const es = W.cs ? W.t : 0, ee = W.ce ? W.t : 0;
      const piece = (s0, s1, y0, y1) => {
        if (s1 - s0 < 1 || y1 - y0 < 1) return;
        const a = s0 <= 0.5 ? -es : s0, b = s1 >= W.L - 0.5 ? W.L + ee : s1;
        box(W, a, b, y0, y1, -W.t, 0, COL.wallIn, tag, { wall: wk, cOut: COL.wallOut, cCap: COL.wallOut, cTop: y1 >= W.H - 1 ? COL.wallTop : COL.wallOut }).forEach(f => faces.push(f));
      };
      let cur = 0;
      cuts.forEach(c => {
        if (c.s0 > cur) piece(cur, c.s0, 0, W.H);
        if (c.y0 > 1) piece(c.s0, c.s1, 0, c.y0);
        if (c.y1 < W.H - 1) piece(c.s0, c.s1, c.y1, W.H);
        cur = Math.max(cur, c.s1);
      });
      if (cur < W.L) piece(cur, W.L, 0, W.H);
    });
  });
  els.forEach(e => {
    const W = e.W, tag = { k: "e", id: e.id }, wk = e.r + ":" + e.w, o = { elw: wk, edge: true };
    const s0 = e.p, s1 = e.p + e.wd;
    if (e.cut) {
      const y0 = e.sl, y1 = Math.min(W.H, e.sl + e.ht), d = -W.t / 2;
      const quad = [W.w(s0, y0, d), W.w(s1, y0, d), W.w(s1, y1, d), W.w(s0, y1, d)];
      if (e.k === "PORTA" || e.k === "JANELA") {
        // guarnição (batentes e verga), levemente saliente nas duas faces da parede
        const fr = e.k === "PORTA" ? [236, 233, 226] : [244, 243, 240], fw = 48, fo = Object.assign({ wall: wk }, o);
        const fb = (a0, a1, b0, b1) => box(W, a0, a1, b0, b1, -W.t - 10, 10, fr, tag, fo).forEach(q => faces.push(q));
        fb(s0, s0 + fw, y0, y1); fb(s1 - fw, s1, y0, y1); fb(s0 + fw, s1 - fw, y1 - fw, y1);
        if (e.k === "JANELA") {
          fb(s0 + fw, s1 - fw, y0, y0 + fw * 0.8);
          box(W, s0 - 40, s1 + 40, y0 - 22, y0 + 8, -W.t, 55, [250, 249, 246], tag, fo).forEach(q => faces.push(q));
          const mid = (s0 + s1) / 2;
          box(W, mid - 18, mid + 18, y0 + fw * 0.8, y1 - fw, d - 22, d + 22, fr, tag, fo).forEach(q => faces.push(q));
          if (y1 - y0 > 1300) box(W, s0 + fw, s1 - fw, (y0 + y1) / 2 - 18, (y0 + y1) / 2 + 18, d - 22, d + 22, fr, tag, fo).forEach(q => faces.push(q));
        } else if (!e.sd) {
          const hs = e.hg ? s1 - 190 : s0 + 90;
          box(W, hs, hs + 100, 1000, 1040, d - 48, d + 48, [188, 186, 180], tag, fo).forEach(q => faces.push(q));
        }
      }
      if (e.k === "PORTA") faces.push(mk(quad, W.N, COL.door, tag, Object.assign({ cull: false, wall: wk, doorp: true, a: e.sd ? 0.9 : 0.95 }, o)));
      else if (e.k === "JANELA") faces.push(mk(quad, W.N, COL.glass, tag, Object.assign({ cull: false, wall: wk, doorp: true, a: 0.42 }, o)));
      else faces.push(mk(quad, W.N, [255, 178, 36], tag, Object.assign({ cull: false, wall: wk, doorp: true, a: 0.05, dash: true }, o)));
    } else if (e.te) {
      const c = e.k === "AGUA" && e.hot ? TECH.AGUA_Q : TECH[e.k];
      if (e.k === "TOMADA" || e.k === "INTERRUPTOR") {
        const plate = [246, 245, 241], ro = { elw: wk, edge: true };
        box(W, e.p - 45, e.p + 45, e.sl - 45, e.sl + 45, 0, 13, plate, tag, ro).forEach(f => faces.push(f));
        if (e.k === "TOMADA") {
          [-20, 20].forEach(dx => box(W, e.p + dx - 7, e.p + dx + 7, e.sl - 14, e.sl + 14, 12, 16, [66, 60, 58], tag, ro).forEach(f => faces.push(f)));
        } else box(W, e.p - 14, e.p + 14, e.sl - 26, e.sl + 26, 12, 22, lite(plate, -0.04), tag, ro).forEach(f => faces.push(f));
      } else box(W, e.p - 40, e.p + 40, e.sl - 40, e.sl + 40, 0, 20, c, tag, { elw: wk, edge: true }).forEach(f => faces.push(f));
    } else if (e.k === "PILAR" || e.k === "DENTE") {
      box(W, s0, s1, 0, W.H, 0, e.dp, e.k === "PILAR" ? COL.pillar : COL.tooth, tag, { elw: wk, edge: true }).forEach(f => faces.push(f));
    } else if (e.k === "VIGA") {
      box(W, s0, s1, e.ht, W.H, 0, e.dp, COL.beam, tag, { elw: wk, edge: true }).forEach(f => faces.push(f));
    } else if (e.k === "BANCADA") {
      const ht = e.ht || 900, dp = e.dp, bo = { elw: wk, edge: true }, add = (...a) => box(W, ...a).forEach(f => faces.push(f));
      add(s0, s1, 0, 100, 0, dp - 45, [84, 68, 54], tag, bo);                      // rodapé recuado
      add(s0, s1, 100, ht - 30, 0, dp - 12, [200, 170, 128], tag, bo);              // gabinete
      add(s0 - 0, s1, ht - 30, ht, 0, dp + 14, [66, 70, 76], tag, bo);              // tampo
      const n = Math.max(1, Math.round(e.wd / 600)), step = e.wd / n;                // frestas entre as portas
      for (let k = 1; k < n; k++) add(s0 + k * step - 3, s0 + k * step + 3, 130, ht - 40, dp - 14, dp - 11, [120, 96, 70], tag, bo);
    } else if (isPia(e)) {
      const ht = e.ht || 900, dp = e.dp, add = (n, ...a) => box(W, ...a, tag, { elw: wk, edge: true, lay: n }).forEach(f => faces.push(f));
      const inox = [196, 200, 205], dk = [44, 48, 54], cd = piaCD(e), ins = (dp - cd) / 2, cubas = piaCubas(e);
      add(0, s0, s1, ht - 45, ht, 0, dp, inox);                                           // tampo em inox (sem armário)
      add(0, s0, s1, ht - 130, ht - 45, dp - 28, dp - 22, shade(inox, 0.85));             // testeira frontal
      [s0 + 25, s1 - 25].forEach(x => { add(0, x - 20, x + 20, 0, ht - 45, dp - 60, dp - 20, shade(inox, 0.78)); add(0, x - 20, x + 20, 0, ht - 45, 20, 60, shade(inox, 0.78)); }); // pés
      cubas.forEach(([a0, a1]) => {
        add(1, a0, a1, ht, ht + 4, ins, ins + cd, shade(inox, 1.08));                       // aro
        add(2, a0 + 24, a1 - 24, ht + 4, ht + 6, ins + 24, ins + cd - 24, dk);              // bacia
      });
      if (e.k === "PIA1") {                                                               // frisos do escorredor
        const c = cubas[0], d0 = e.hg ? s0 + 40 : c[1] + 40, d1 = e.hg ? c[0] - 40 : s1 - 40;
        if (d1 - d0 > 120) for (let k = 0; k < 6; k++) { const x = d0 + (d1 - d0) * (k + 0.5) / 6; add(2, x - 5, x + 5, ht, ht + 3, ins + 30, ins + cd - 30, dk); }
      }
      const fx = cubas.length === 1 ? (cubas[0][0] + cubas[0][1]) / 2 : (cubas[0][1] + cubas[1][0]) / 2, fd = Math.max(ins * 0.5, 22);
      add(3, fx - 12, fx + 12, ht, ht + 250, fd - 12, fd + 12, [150, 154, 160]);          // torneira
      add(3, fx - 10, fx + 10, ht + 232, ht + 258, fd - 12, fd + 170, [150, 154, 160]);
    } else if (e.k === "CUBA") {
      const host = els.find(x => x.k === "BANCADA" && x.R === e.R && x.W === e.W && e.p + e.wd / 2 >= x.p && e.p + e.wd / 2 <= x.p + x.wd);
      const ht = host ? (host.ht || 900) : 900, inset = host ? Math.max(0, (host.dp - e.dp) / 2) : 60;
      const add = (n, ...a) => box(W, ...a, tag, { elw: wk, edge: true, lay: n }).forEach(f => faces.push(f)), mid = e.p + e.wd / 2;
      add(1, s0, s1, ht, ht + 8, inset, inset + e.dp, [206, 209, 213]);                  // aro da cuba

/* ───────────── câmera e desenho ───────────── */
const cv = $("cv"), g = cv.getContext("2d");

const LIGHT = norm([-0.35, 0.85, 0.4]);

function render() {

  g.clearRect(0, 0, VW, VH);
  // paredes "fantasma": a câmera está do lado de fora
  const ghost = {};
  rooms.forEach(R => { if (R.closed) R.walls.forEach(W => { ghost[R.i + ":" + W.i] = dot(sub(EYE, [W.A[0], 0, W.A[1]]), [W.out[0], 0, W.out[1]]) > 0; }); });

    const cl = pc.some(p => p[2] < NEAR) ? clipNear(pc) : pc;

/* ───────────── seleção, cotas e painel ───────────── */

    start(JSON.parse(await new Response(stream).text()));
  } catch (err) {
    $("panel").innerHTML = "<h2>Não foi possível abrir</h2><div class='sub'>Use um navegador atualizado (Chrome, Edge, Safari ou Firefox recentes) ou peça o arquivo .html de 3D.</div>";
  }
}
if (DATA) start(DATA); else fromHash();
</script>
</body>
</html>
